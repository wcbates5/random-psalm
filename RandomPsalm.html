<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Psalm Generator</title>
    <style>
        :root {
            --bg: #123524;
            --container: #0a2818;
            --text: #f5e8c7;
            --accent: #d4af37;
            --soft: #8fbc8f;
            --button: #2e8b57;
            --display-text: #123524;
            --title: #361612;
            --verse-num: #8b0000;
            --marquee-bg: #361612;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "MS Gothic", "MS PGothic", "ＭＳ ゴシック", sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            width: 640px;
            margin: 0 auto;
            border: 6px ridge var(--accent);
            background-color: var(--container);
            padding: 12px;
        }
        
        h1 {
            color: var(--accent);
            font-size: 18px;
            margin: 8px 0;
        }
        
        .subtitle {
            color: var(--soft);
            font-size: 13px;
            margin-bottom: 14px;
            font-style: italic;
        }
        
        .controls {
            margin: 12px 0;
        }
        
        label {
            color: var(--text);
            font-size: 14px;
            margin-right: 8px;
        }
        
        select {
            font-family: "MS Gothic", "MS PGothic", "ＭＳ ゴシック", sans-serif;
            font-size: 14px;
            padding: 4px 8px;
            background-color: #f5e8c7;
            color: #123524;
            border: 2px solid var(--accent);
            margin: 0 8px 8px 0;
        }
        
        .marquee-box {
            background-color: var(--marquee-bg);
            border: 2px solid var(--accent);
            padding: 6px;
            margin: 12px 0;
            color: var(--text);
            font-size: 13px;
            font-weight: bold;
        }
        
        button {
            background-color: var(--button);
            color: var(--text);
            font-family: "MS Gothic", "MS PGothic", "ＭＳ ゴシック", sans-serif;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 18px;
            border: 3px outset var(--accent);
            cursor: pointer;
            margin: 10px 0;
        }
        
        button:active {
            border-style: inset;
        }
        
        #psalm-display {
            background-color: #f5e8c7;
            color: var(--display-text);
            border: 4px double var(--accent);
            padding: 16px;
            margin: 16px 0;
            text-align: left;
            min-height: 180px;
            font-size: 14px;
        }
        
        #psalm-title {
            text-align: center;
            color: var(--title);
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--display-text);
            padding-bottom: 6px;
        }
        
        .verse {
            margin: 9px 0;
            line-height: 1.45;
        }
        
        .verse-number {
            font-weight: bold;
            color: var(--verse-num);
            margin-right: 6px;
        }
        
        .loading {
            text-align: center;
            font-style: italic;
            color: #555;
            font-size: 14px;
            padding: 40px 0;
        }
        
        .footer {
            margin-top: 14px;
            font-size: 11px;
            color: var(--soft);
            border-top: 1px dashed var(--accent);
            padding-top: 8px;
        }
        
        hr {
            border: none;
            height: 2px;
            background-color: var(--accent);
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Random Psalm Generator</h1>
        <div class="subtitle" id="subtitle">Public Domain Translations</div>
        
        <div class="controls">
            <label for="lang" id="lang-label">Language:</label>
            <select id="lang" onchange="changeLanguage()">
                <option value="kjv">English (KJV)</option>
                <option value="luth1912">Deutsch (Luther 1912)</option>
                <option value="nb1930">Norsk (1930)</option>
                <option value="dansk1931">Dansk (1931)</option>
                <option value="dutch1917">Nederlands (1917)</option>
                <option value="sv1917">Svenska (1917)</option>
                <option value="pr1933">Suomi (1933/38)</option>
                <option value="lsg">Français (Louis Segond)</option>
                <option value="kgy">日本語 (口語訳)</option>
            </select>

            <label for="theme">Theme:</label>
            <select id="theme" onchange="changeTheme()">
                <option value="phthalo">Phthalo Green</option>
                <option value="woad">Woad Blue</option>
                <option value="indigo">Indigo</option>
                <option value="madder">Madder Red</option>
                <option value="ochre">Yellow Ochre</option>
            </select>
        </div>
        
        <div class="marquee-box">
            <marquee behavior="scroll" direction="left" scrollamount="8" id="marquee-text">
                Welcome. Select a language and click the button to receive a random Psalm.
            </marquee>
        </div>
        
        <button onclick="getRandomPsalm()" id="pick-btn">Pick a Random Psalm</button>
        
        <div id="psalm-display"></div>
        
        <hr>
        
        <div class="footer">
            <p id="footer-text">Texts from public domain sources via api.midvash.com</p>
        </div>
    </div>

    <script>
        let currentPsalm = null;
        let psalmQueue = [];
        const QUEUE_SIZE = 12;

        const themes = {
            phthalo: {
                bg: "#123524",
                container: "#0a2818",
                text: "#f5e8c7",
                accent: "#d4af37",       /* gold */
                soft: "#8fbc8f",
                button: "#2e8b57",
                displayText: "#123524",
                title: "#361612",
                verseNum: "#8b0000",    /* dark red */
                marqueeBg: "#361612"
            },
            woad: {
                bg: "#1a3a5c",
                container: "#0f2438",
                text: "#e8f0f8",
                accent: "#e8b923",       /* warm gold */
                soft: "#7eb8d4",
                button: "#2a6a9a",
                displayText: "#1a3a5c",
                title: "#38230F",
                verseNum: "#38230F",     /* terracotta */
                marqueeBg: "#38230F"
            },
            indigo: {
                bg: "#1c1445",
                container: "#120c2e",
                text: "#e6e0f5",
                accent: "#e8c547",       /* soft gold */
                soft: "#b8a0d4",
                button: "#4a3a9a",
                displayText: "#1c1445",
                title: "#2E0C21",
                verseNum: "#2E0C21",     /* coral */
                marqueeBg: "#2E0C21"
            },
            madder: {
                bg: "#5c1a1a",
                container: "#3a0f0f",
                text: "#f5e8e8",
                accent: "#e8c547",       /* gold */
                soft: "#d4a0a0",
                button: "#9a3a3a",
                displayText: "#5c1a1a",
                title: "#0F3A3A",
                verseNum: "#0F3A3A",     /* deep amber-red */
                marqueeBg: "#0F3A3A"
            },
            ochre: {
                bg: "#5c4a1a",
                container: "#3a2e0f",
                text: "#f5f0e0",
                accent: "#f0d060",       /* bright gold */
                soft: "#d4c48a",
                button: "#9a7a2a",
                displayText: "#5c4a1a",
                title: "#123A0F",
                verseNum: "#123A0F",     /* warm red-brown */
                marqueeBg: "#123A0F"
            }
        };

        const ui = {
            kjv: {
                title: "Random Psalm",
                subtitle: "Public Domain Translations",
                langLabel: "Language:",
                marquee: "Welcome. Select a language and click the button to receive a random Psalm.",
                button: "Pick a Random Psalm",
                loading: "Loading Psalm...",
                error: "Connection failed. Please try again.",
                psalm: "Psalm",
                footer: "Texts from public domain sources via api.midvash.com"
            },
            luth1912: {
                title: "Zufälliger Psalm",
                subtitle: "Gemeinfreie Übersetzungen",
                langLabel: "Sprache:",
                marquee: "Willkommen. Wähle eine Sprache und klicke auf den Button für einen zufälligen Psalm.",
                button: "Zufälligen Psalm wählen",
                loading: "Psalm wird geladen...",
                error: "Verbindung fehlgeschlagen. Bitte erneut versuchen.",
                psalm: "Psalm",
                footer: "Texte aus gemeinfreien Quellen über api.midvash.com"
            },
            nb1930: {
                title: "Tilfeldig Salme",
                subtitle: "Offentlige oversettelser",
                langLabel: "Språk:",
                marquee: "Velkommen. Velg et språk og klikk på knappen for å få en tilfeldig salme.",
                button: "Velg en tilfeldig salme",
                loading: "Laster salme...",
                error: "Tilkobling mislyktes. Prøv igjen.",
                psalm: "Salme",
                footer: "Tekster fra offentlige kilder via api.midvash.com"
            },
            dansk1931: {
                title: "Tilfældig Salme",
                subtitle: "Offentlige oversættelser",
                langLabel: "Sprog:",
                marquee: "Velkommen. Vælg et sprog og klik på knappen for at få en tilfældig salme.",
                button: "Vælg en tilfældig salme",
                loading: "Indlæser salme...",
                error: "Forbindelse mislykkedes. Prøv igen.",
                psalm: "Salme",
                footer: "Tekster fra offentlige kilder via api.midvash.com"
            },
            dutch1917: {
                title: "Willekeurige Psalm",
                subtitle: "Publiek domein vertalingen",
                langLabel: "Taal:",
                marquee: "Welkom. Selecteer een taal en klik op de knop voor een willekeurige psalm.",
                button: "Kies een willekeurige psalm",
                loading: "Psalm laden...",
                error: "Verbinding mislukt. Probeer het opnieuw.",
                psalm: "Psalm",
                footer: "Teksten uit publiek domein via api.midvash.com"
            },
            sv1917: {
                title: "Slumpmässig Psalm",
                subtitle: "Allmän egendom översättningar",
                langLabel: "Språk:",
                marquee: "Välkommen. Välj ett språk och klicka på knappen för att få en slumpmässig psalm.",
                button: "Välj en slumpmässig psalm",
                loading: "Laddar psalm...",
                error: "Anslutningen misslyckades. Försök igen.",
                psalm: "Psalm",
                footer: "Texter från allmän egendom via api.midvash.com"
            },
            pr1933: {
                title: "Satunnainen Psalmi",
                subtitle: "Julkiset käännökset",
                langLabel: "Kieli:",
                marquee: "Tervetuloa. Valitse kieli ja napsauta painiketta saadaksesi satunnaisen psalmin.",
                button: "Valitse satunnainen psalmi",
                loading: "Ladataan psalmia...",
                error: "Yhteys epäonnistui. Yritä uudelleen.",
                psalm: "Psalmi",
                footer: "Tekstit julkisista lähteistä api.midvash.com kautta"
            },
            lsg: {
                title: "Psaume Aléatoire",
                subtitle: "Traductions du domaine public",
                langLabel: "Langue :",
                marquee: "Bienvenue. Sélectionnez une langue et cliquez sur le bouton pour recevoir un psaume aléatoire.",
                button: "Choisir un psaume aléatoire",
                loading: "Chargement du psaume...",
                error: "Échec de la connexion. Veuillez réessayer.",
                psalm: "Psaume",
                footer: "Textes du domaine public via api.midvash.com"
            },
            kgy: {
                title: "ランダム詩篇",
                subtitle: "パブリックドメイン翻訳",
                langLabel: "言語：",
                marquee: "ようこそ。言語を選択してボタンをクリックすると、ランダムな詩篇が表示されます。",
                button: "ランダムな詩篇を選ぶ",
                loading: "詩篇を読み込み中...",
                error: "接続に失敗しました。もう一度お試しください。",
                psalm: "詩篇",
                footer: "パブリックドメインのテキスト（api.midvash.com経由）"
            }
        };

        function changeTheme() {
            const name = document.getElementById('theme').value;
            const t = themes[name];
            const root = document.documentElement;

            root.style.setProperty('--bg', t.bg);
            root.style.setProperty('--container', t.container);
            root.style.setProperty('--text', t.text);
            root.style.setProperty('--accent', t.accent);
            root.style.setProperty('--soft', t.soft);
            root.style.setProperty('--button', t.button);
            root.style.setProperty('--display-text', t.displayText);
            root.style.setProperty('--title', t.title);
            root.style.setProperty('--verse-num', t.verseNum);
            root.style.setProperty('--marquee-bg', t.marqueeBg);
        }

        function getRandomPsalmNumber(exclude = []) {
            let num;
            do {
                num = Math.floor(Math.random() * 150) + 1;
            } while (exclude.includes(num));
            return num;
        }

        async function fetchPsalm(num, version) {
            const response = await fetch(`https://api.midvash.com/v1/${version}/psalms/${num}`);
            if (!response.ok) throw new Error('Fetch failed');
            const json = await response.json();
            return { num, data: json.data };
        }

        async function fillQueue() {
            const version = document.getElementById('lang').value;
            const existing = psalmQueue.map(p => p.num);
            const needed = QUEUE_SIZE - psalmQueue.length;

            const promises = [];
            const used = [...existing];

            for (let i = 0; i < needed; i++) {
                const num = getRandomPsalmNumber(used);
                used.push(num);
                promises.push(fetchPsalm(num, version).catch(() => null));
            }

            const results = await Promise.all(promises);
            results.forEach(r => {
                if (r) psalmQueue.push(r);
            });
        }

        async function changeLanguage() {
            const version = document.getElementById('lang').value;
            const t = ui[version];
            
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('lang-label').textContent = t.langLabel;
            document.getElementById('marquee-text').textContent = t.marquee;
            document.getElementById('pick-btn').textContent = t.button;
            document.getElementById('footer-text').textContent = t.footer;
            
            document.documentElement.lang = 
                version === 'kgy' ? 'ja' :
                version === 'luth1912' ? 'de' :
                version === 'nb1930' ? 'no' :
                version === 'dansk1931' ? 'da' :
                version === 'dutch1917' ? 'nl' :
                version === 'sv1917' ? 'sv' :
                version === 'pr1933' ? 'fi' :
                version === 'lsg' ? 'fr' : 'en';

            psalmQueue = [];
            const display = document.getElementById('psalm-display');
            display.innerHTML = `<div class="loading">${t.loading}</div>`;

            await fillQueue();

            if (currentPsalm !== null) {
                try {
                    const p = await fetchPsalm(currentPsalm, version);
                    displayPsalm(p);
                } catch {
                    getRandomPsalm();
                }
            } else {
                display.innerHTML = "";
            }
        }

        function displayPsalm(p) {
            const t = ui[document.getElementById('lang').value];
            let html = `<div id="psalm-title">${t.psalm} ${p.num}</div>`;
            
            p.data.verses.forEach((text, index) => {
                const cleanText = text.replace(/\n/g, ' ').trim();
                html += `<div class="verse"><span class="verse-number">${index + 1}</span>${cleanText}</div>`;
            });
            
            document.getElementById('psalm-display').innerHTML = html;
            currentPsalm = p.num;
        }

        async function getRandomPsalm() {
            const t = ui[document.getElementById('lang').value];
            const display = document.getElementById('psalm-display');

            if (psalmQueue.length === 0) {
                display.innerHTML = `<div class="loading">${t.loading}</div>`;
                await fillQueue();
            }

            if (psalmQueue.length === 0) {
                display.innerHTML = `<div class="loading" style="color:#8b0000;">${t.error}</div>`;
                return;
            }

            const next = psalmQueue.shift();
            displayPsalm(next);

            fillQueue();
        }
        
        // Initialize
        changeTheme();
        changeLanguage();
    </script>
</body>
</html>
